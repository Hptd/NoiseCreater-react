<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="thumbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC46B"/>
      <stop offset="0.45" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A1F" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FF8A1F" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3B0"/>
      <stop offset="1" stop-color="#FFA53C"/>
    </linearGradient>

    <filter id="thumbShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#FF6B1A" flood-opacity="0.35"/>
    </filter>

    <filter id="softGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="spark" d="M0 -10 C1 -3.6 3.6 -1 10 0 C3.6 1 1 3.6 0 10 C-1 3.6 -3.6 1 -10 0 C-3.6 -1 -1 -3.6 0 -10 Z"/>
  </defs>

  <circle cx="128" cy="128" r="104" fill="url(#glowGrad)"/>

  <g filter="url(#thumbShadow)">
    <path transform="translate(20 20) scale(9)" fill="url(#thumbGrad)" stroke="#E2540C" stroke-width="0.2" stroke-linejoin="round"
      d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
  </g>

  <g filter="url(#softGlow)" fill="url(#sparkGrad)">
    <use href="#spark" transform="translate(205 48) scale(1.4)"/>
    <use href="#spark" transform="translate(56 42) scale(0.85)"/>
    <use href="#spark" transform="translate(222 122) scale(0.55)"/>
  </g>

  <g fill="#FFB066">
    <circle cx="46" cy="146" r="6" opacity="0.5"/>
    <circle cx="228" cy="176" r="5" opacity="0.45"/>
    <circle cx="168" cy="28" r="4" opacity="0.6"/>
    <circle cx="86" cy="216" r="4" opacity="0.4"/>
  </g>
</svg>
